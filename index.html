<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>معرض الصور</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f4; margin: 20px; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .gallery img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <h2>معرض الصور</h2>
  <div class="gallery" id="gallery"></div>

  <script>
    const username = 'mohammedahmedalkhadher-ops';
    const repo = 'صوري';
    
    const gallery = document.getElementById('gallery');

    // جلب كل الصور الموجودة في مجلد images تلقائياً
    fetch(`https://api.github.com/repos/${username}/${encodeURIComponent(repo)}/contents/images`)
      .then(response => response.json())
      .then(files => {
        if(Array.isArray(files)) {
          files.forEach(file => {
            if (file.name.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
              const img = document.createElement('img');
              img.src = file.download_url;
              img.loading = "lazy";
              gallery.appendChild(img);
            }
          });
        }
      })
      .catch(err => console.error('خطأ في تحميل الصور:', err));
  </script>
</body>
</html>
